[package]
name = "m3"
version = "0.1.0"
edition = "2021"
rust-version = "1.93" # own MSRV: proven on 1.93.0 (cargo-kani 0.67.0 ships rustc 1.93.0-nightly)
license = "MIT"
publish = false

[dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

# Its own workspace: each module keeps its own Cargo.lock, so module PRs never conflict.
[workspace]
