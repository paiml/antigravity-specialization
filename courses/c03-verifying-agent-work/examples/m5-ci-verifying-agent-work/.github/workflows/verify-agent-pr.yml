name: Verify Agent PR

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify-agent-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run agent PR verification gate
        run: bash ./verify-agent-pr.sh sample-pr
