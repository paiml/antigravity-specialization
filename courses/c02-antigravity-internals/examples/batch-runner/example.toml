[example]
title       = "Batch the pipeline"
summary     = "a Rust orchestrator that runs the pipeline over many files in parallel"
description = "The plan from the interview, built. It replaces a bash loop with a concurrent runner: a thread pool, a progress bar, one aggregated log, and a batch that survives a bad file instead of stopping on it. It is an orchestrator, not an image processor; ImageMagick still does the pixels."
run         = "cargo run -- --dir images --cmd 'convert {} -transpose +repage {}.t.png'"
requires    = "Requires Rust (`cargo`) and ImageMagick. On ImageMagick 7 put `magick` in the command template instead of `convert`."

