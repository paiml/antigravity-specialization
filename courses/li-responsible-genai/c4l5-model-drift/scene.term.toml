# scene.term.toml: terminal scene for rg-4-1-5-model-drift (TRM 4.1). Every command below was run for real; see captures/.
schema_version = 1

[contract]
name = "rg-4-1-5-model-drift"
description = "Re-check when the model changes."

[session]
command = ["bash", "--norc", "--noprofile", "-i"]
cwd = "."
cols = 110
rows = 34
host = "none"
term = "xterm-256color"

[session.env]
PS1 = "$ "
HOME = "/tmp/rg-home"
PATH = "/tmp/rg-home/bin:/usr/bin:/bin"
TZ = "UTC"
LC_ALL = "C.UTF-8"
LANG = "C.UTF-8"
PROMPT_COMMAND = 'l=$_; if [ -n "$P" ] && [ "$l" != clear ]; then sleep 2; fi; P=1'
DRIFT_PROBES = "data/probes-short.txt"

[[step]]
wait_for = "$"
timeout_ms = 10000

[[step]]
mark = "intro"

[[step]]
send = ["text:clear", "enter"]

[[step]]
mark = "step-1"

[[step]]
send = ["text:../scripts/serve.sh", "enter"]

[[step]]
wait_for = "server up"
timeout_ms = 180000

[[step]]
send = ["text:clear", "enter"]

[[step]]
mark = "step-2"

[[step]]
send = ["text:./run.sh", "enter"]

[[step]]
wait_for = "re-check done"
timeout_ms = 1500000

[[step]]
send = ["text:clear", "enter"]

[[step]]
mark = "step-3"

[[step]]
send = ["text:../scripts/stop.sh", "enter"]

[[step]]
wait_for = "stopped"
timeout_ms = 48000

[[step]]
mark = "end"

[render]
fps = 12
cell_width = 9
cell_height = 18
font_family = "JetBrains Mono"
theme = "rmedia-dark"

[scan]
extra_deny = []

[source]
repo = "paiml/demo-responsible-genai"
commit = "1a0240f6fad26469722fdfd1ba929b598e37dd4a"
command = ["bash", "--norc", "--noprofile", "-i"]
workdir = "."

[[source.shown]]
path = "run.sh"
sha256 = "9f645017e9909747757bb8e45323adc382b04a531c71dfba4de925aee6d84e12"
