# scene.term.toml: terminal scene for rg-4-1-6-conclusion (TRM 4.1). Every command below was run for real; see captures/.
schema_version = 1

[contract]
name = "rg-4-1-6-conclusion"
description = "Recap: the three runtimes and their versions on one line each."

[session]
command = ["bash", "--norc", "--noprofile", "-i"]
cwd = "."
cols = 110
rows = 34
host = "none"
term = "xterm-256color"

[session.env]
PS1 = "$ "
HOME = "/tmp/rg-home"
PATH = "/tmp/rg-home/bin:/usr/bin:/bin"
TZ = "UTC"
LC_ALL = "C.UTF-8"
LANG = "C.UTF-8"
PROMPT_COMMAND = 'l=$_; if [ -n "$P" ] && [ "$l" != clear ]; then sleep 28; fi; P=1'

[[step]]
wait_for = "$"
timeout_ms = 10000

[[step]]
mark = "intro"

[[step]]
send = ["text:clear", "enter"]

[[step]]
mark = "step-1"

[[step]]
send = ["text:apr --version", "enter"]

[[step]]
wait_for = "apr 0.74"
timeout_ms = 58000

[[step]]
send = ["text:clear", "enter"]

[[step]]
mark = "step-2"

[[step]]
send = ["text:llama-cli --version", "enter"]

[[step]]
wait_for = "built with GNU"
timeout_ms = 58000

[[step]]
send = ["text:clear", "enter"]

[[step]]
mark = "step-3"

[[step]]
send = ["text:ollama --version", "enter"]

[[step]]
wait_for = "ollama version is"
timeout_ms = 58000

[[step]]
mark = "end"

[render]
fps = 12
cell_width = 9
cell_height = 18
font_family = "JetBrains Mono"
theme = "rmedia-dark"

[scan]
extra_deny = []

[source]
repo = "paiml/demo-responsible-genai"
commit = "1a0240f6fad26469722fdfd1ba929b598e37dd4a"
command = ["bash", "--norc", "--noprofile", "-i"]
workdir = "."

[[source.shown]]
path = "README.md"
sha256 = "e446d9a1e6c01ed4c33f06099de8ee5b1177323d0ae50d14c5bd5500ccda9106"
