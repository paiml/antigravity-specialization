# scene.term.toml: terminal scene for rg-1-1-0-local-or-hosted (TRM 4.1). Every command below was run for real; see captures/.
schema_version = 1

[contract]
name = "rg-1-1-0-local-or-hosted"
description = "Three runtimes by version, then one prompt answered offline on this machine."

[session]
command = ["bash", "--norc", "--noprofile", "-i"]
cwd = "."
cols = 110
rows = 34
host = "none"
term = "xterm-256color"

[session.env]
PS1 = "$ "
HOME = "/tmp/rg-home"
PATH = "/tmp/rg-home/bin:/usr/bin:/bin"
TZ = "UTC"
LC_ALL = "C.UTF-8"
LANG = "C.UTF-8"
PROMPT_COMMAND = 'l=$_; if [ -n "$P" ] && [ "$l" != clear ]; then sleep 21; fi; P=1'

[[step]]
wait_for = "$"
timeout_ms = 10000

[[step]]
mark = "intro"

[[step]]
send = ["text:clear", "enter"]

[[step]]
mark = "step-1"

[[step]]
send = ["text:apr --version", "enter"]

[[step]]
wait_for = "apr 0.74"
timeout_ms = 51000

[[step]]
send = ["text:clear", "enter"]

[[step]]
mark = "step-2"

[[step]]
send = ["text:llama-cli --version", "enter"]

[[step]]
wait_for = "built with GNU"
timeout_ms = 51000

[[step]]
send = ["text:clear", "enter"]

[[step]]
mark = "step-3"

[[step]]
send = ["text:ollama --version", "enter"]

[[step]]
wait_for = "ollama version is"
timeout_ms = 51000

[[step]]
send = ["text:clear", "enter"]

[[step]]
mark = "step-4"

[[step]]
send = ["text:apr run ~/.cache/pacha/models/8de7eb9c0c789ccb.gguf 'What is 2+2?' --chat -n 24 --no-gpu --offline", "enter"]

[[step]]
wait_for = "Completed in"
timeout_ms = 240000

[[step]]
mark = "end"

[render]
fps = 12
cell_width = 9
cell_height = 18
font_family = "JetBrains Mono"
theme = "rmedia-dark"

[scan]
extra_deny = []
