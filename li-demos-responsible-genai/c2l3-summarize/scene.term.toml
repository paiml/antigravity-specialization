# scene.term.toml: terminal scene for rg-2-1-3-summarize (TRM 4.1). Every command below was run for real; see captures/.
schema_version = 1

[contract]
name = "rg-2-1-3-summarize"
description = "Summarize a memo locally, nothing uploaded."

[session]
command = ["bash", "--norc", "--noprofile", "-i"]
cwd = "."
cols = 110
rows = 34
host = "none"
term = "xterm-256color"

[session.env]
PS1 = "$ "
HOME = "/tmp/rg-home"
PATH = "/tmp/rg-home/bin:/usr/bin:/bin"
TZ = "UTC"
LC_ALL = "C.UTF-8"
LANG = "C.UTF-8"
PROMPT_COMMAND = 'l=$_; if [ -n "$P" ] && [ "$l" != clear ]; then sleep 31; fi; P=1'

[[step]]
wait_for = "$"
timeout_ms = 10000

[[step]]
mark = "intro"

[[step]]
send = ["text:clear", "enter"]

[[step]]
mark = "step-1"

[[step]]
send = ["text:../scripts/serve.sh", "enter"]

[[step]]
wait_for = "server up"
timeout_ms = 180000

[[step]]
send = ["text:clear", "enter"]

[[step]]
mark = "step-2"

[[step]]
send = ["text:./run.sh", "enter"]

[[step]]
wait_for = "Budget for the refresh"
timeout_ms = 400000

[[step]]
send = ["text:clear", "enter"]

[[step]]
mark = "step-3"

[[step]]
send = ["text:../scripts/stop.sh", "enter"]

[[step]]
wait_for = "stopped"
timeout_ms = 61000

[[step]]
mark = "end"

[render]
fps = 12
cell_width = 9
cell_height = 18
font_family = "JetBrains Mono"
theme = "rmedia-dark"

[scan]
extra_deny = []

[source]
repo = "paiml/demo-responsible-genai"
commit = "1a0240f6fad26469722fdfd1ba929b598e37dd4a"
command = ["bash", "--norc", "--noprofile", "-i"]
workdir = "."

[[source.shown]]
path = "run.sh"
sha256 = "d62491cba6700e53d709838a266124daf5f9422226546f5bdb433e18ccfc7006"
