# scene.term.toml: terminal scene for rg-1-1-2-install-pull (TRM 4.1). Every command below was run for real; see captures/.
schema_version = 1

[contract]
name = "rg-1-1-2-install-pull"
description = "Check three runtimes and see what each one holds for one small model family."

[session]
command = ["bash", "--norc", "--noprofile", "-i"]
cwd = "."
cols = 110
rows = 34
host = "none"
term = "xterm-256color"

[session.env]
PS1 = "$ "
HOME = "/tmp/rg-home"
PATH = "/tmp/rg-home/bin:/usr/bin:/bin"
TZ = "UTC"
LC_ALL = "C.UTF-8"
LANG = "C.UTF-8"
PROMPT_COMMAND = 'l=$_; if [ -n "$P" ] && [ "$l" != clear ]; then sleep 14; fi; P=1'

[[step]]
wait_for = "$"
timeout_ms = 10000

[[step]]
mark = "intro"

[[step]]
send = ["text:clear", "enter"]

[[step]]
mark = "step-1"

[[step]]
send = ["text:apr --version", "enter"]

[[step]]
wait_for = "apr 0.74"
timeout_ms = 44000

[[step]]
send = ["text:clear", "enter"]

[[step]]
mark = "step-2"

[[step]]
send = ["text:llama-cli --version", "enter"]

[[step]]
wait_for = "built with GNU"
timeout_ms = 44000

[[step]]
send = ["text:clear", "enter"]

[[step]]
mark = "step-3"

[[step]]
send = ["text:ollama --version", "enter"]

[[step]]
wait_for = "ollama version is"
timeout_ms = 44000

[[step]]
send = ["text:clear", "enter"]

[[step]]
mark = "step-4"

[[step]]
send = ["text:apr pull --dry-run hf://Qwen/Qwen2.5-Coder-0.5B-Instruct", "enter"]

[[step]]
wait_for = "dry-run (no network I/O)"
timeout_ms = 44000

[[step]]
send = ["text:clear", "enter"]

[[step]]
mark = "step-5"

[[step]]
send = ["text:ollama ps", "enter"]

[[step]]
wait_for = "PROCESSOR"
timeout_ms = 44000

[[step]]
send = ["text:clear", "enter"]

[[step]]
mark = "step-6"

[[step]]
send = ["text:apr list", "enter"]

[[step]]
wait_for = "MB used"
timeout_ms = 44000

[[step]]
send = ["text:clear", "enter"]

[[step]]
mark = "step-7"

[[step]]
send = ["text:llama-cli --cache-list", "enter"]

[[step]]
wait_for = "models in cache"
timeout_ms = 44000

[[step]]
send = ["text:clear", "enter"]

[[step]]
mark = "step-8"

[[step]]
send = ["text:ollama show qwen2.5-coder:0.5b", "enter"]

[[step]]
wait_for = "January 2004"
timeout_ms = 44000

[[step]]
mark = "end"

[render]
fps = 12
cell_width = 9
cell_height = 18
font_family = "JetBrains Mono"
theme = "rmedia-dark"

[scan]
extra_deny = []
