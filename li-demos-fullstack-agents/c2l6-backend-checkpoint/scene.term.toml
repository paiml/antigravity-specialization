# scene.term.toml: terminal scene for c2l6-backend-checkpoint. Every command typed below is a command from run.sh (agent steps omitted: agy quota).
schema_version = 1

[contract]
name = "fsa-c2l6-backend-checkpoint"
description = "Run the backend tests and walk the whole API with curl."

[session]
command = ["bash", "--norc", "--noprofile", "-i"]
cwd = "."
cols = 110
rows = 34
host = "none"
term = "xterm-256color"

[session.env]
PS1 = "$ "
HOME = "/tmp/c3-home"
PATH = "/tmp/c3-home/bin:/usr/bin:/bin"
TZ = "UTC"
LC_ALL = "C.UTF-8"
LANG = "C.UTF-8"
PROMPT_COMMAND = 'l=$_; if [ -n "$P" ] && [ "$l" != clear ]; then sleep 2; fi; P=1'

[[step]]
wait_for = "$"
timeout_ms = 10000

[[step]]
mark = "intro"

[[step]]
send = ["text:. ../lib/common.sh", "enter"]

[[step]]
send = ["text:need_node", "enter"]

[[step]]
send = ["text:new_workdir", "enter"]

[[step]]
send = ["text:copy_ms ch2-done \"$WORK/app\"", "enter"]

[[step]]
send = ["text:cd \"$WORK/app\" || exit 1", "enter"]

[[step]]
send = ["text:clear", "enter"]

[[step]]
mark = "step-1"

[[step]]
send = ["text:say \"unit and API tests\"", "enter"]

[[step]]
send = ["text:node --test --test-force-exit 2>&1 | grep -E '^# (tests|pass|fail)' | sed 's/^/  /'", "enter"]

[[step]]
wait_for = "# fail 0"
timeout_ms = 120000

[[step]]
send = ["text:clear", "enter"]

[[step]]
mark = "step-2"

[[step]]
send = ["text:say \"the whole API from curl\"", "enter"]

[[step]]
send = ["text:PORT=$(free_port) scripts/smoke.sh || exit 1", "enter"]

[[step]]
wait_for = "smoke OK"
timeout_ms = 120000

[[step]]
send = ["text:clear", "enter"]

[[step]]
mark = "step-3"

[[step]]
send = ["text:say \"tag the milestone in a scratch repository\"", "enter"]

[[step]]
send = ["text:g() { git -c core.hooksPath=/dev/null -c user.name=demo -c user.email=demo \"$@\"; }", "enter"]

[[step]]
send = ["text:g init -q -b main", "enter"]

[[step]]
send = ["text:g add -A", "enter"]

[[step]]
send = ["text:g commit -q -m \"ch2: migrations, API, auth, docs\"", "enter"]

[[step]]
send = ["text:g tag ch2-done", "enter"]

[[step]]
send = ["text:g log --oneline --decorate | sed 's/^/  /'", "enter"]

[[step]]
wait_for = "(HEAD -> main, tag: ch2-done)"
timeout_ms = 120000

[[step]]
mark = "end"

[render]
fps = 12
cell_width = 9
cell_height = 18
font_family = "JetBrains Mono"
theme = "rmedia-dark"

[scan]
extra_deny = []

[source]
repo = "paiml/fullstack-antigravity-agents"
commit = "3c76d28feef54d1ede9990f257ffb55cebe92ca3"
command = ["bash", "--norc", "--noprofile", "-i"]
workdir = "."

[[source.shown]]
path = "run.sh"
sha256 = "f10bd7006cecb037dd397696daa470245db478e68ec59202b326165f14b8fb9b"
