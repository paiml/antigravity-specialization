name: ci
on:
  pull_request: {}
  push:
    branches: [main]
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Lint and test
        run: make ci
      - name: Smoke test
        run: make smoke
