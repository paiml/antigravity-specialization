# scene.term.toml: terminal scene for c1l2-context. The agent step runs through scripts/agy-replay.sh: a replay of a reference reply, NOT live agent output (agy quota).
schema_version = 1

[contract]
name = "fsa-c1l2-context"
description = "Show the chapter 1 context file and check every make command it names. The agent reply is a labelled replay."

[session]
command = ["bash", "--norc", "--noprofile", "-i"]
cwd = "."
cols = 110
rows = 34
host = "none"
term = "xterm-256color"

[session.env]
PS1 = "$ "
HOME = "/tmp/c3-home"
PATH = "/tmp/c3-home/bin:/usr/bin:/bin"
TZ = "UTC"
LC_ALL = "C.UTF-8"
LANG = "C.UTF-8"
AGY_BIN = "../scripts/agy-replay.sh"
PROMPT_COMMAND = 'l=$_; if [ -n "$P" ] && [ "$l" != clear ]; then sleep 2; fi; P=1'

[[step]]
wait_for = "$"
timeout_ms = 10000

[[step]]
mark = "intro"

[[step]]
send = ["text:export AGY_BIN=$(realpath \"$AGY_BIN\")", "enter"]

[[step]]
send = ["text:clear", "enter"]

[[step]]
mark = "step-1"

[[step]]
send = ["text:./run.sh", "enter"]

[[step]]
wait_for = "caught: make deploy-all is not a target"
timeout_ms = 120000

[[step]]
mark = "end"

[render]
fps = 12
cell_width = 9
cell_height = 18
font_family = "JetBrains Mono"
theme = "rmedia-dark"

[scan]
extra_deny = []

[source]
repo = "paiml/fullstack-antigravity-agents"
commit = "dd486bcb980c0efd114645589417ccf9e33d0f16"
command = ["bash", "--norc", "--noprofile", "-i"]
workdir = "."

[[source.shown]]
path = "run.sh"
sha256 = "a3a6ead91c214499437414c8862d9c99b4be3fb1d2ed90043bcb33bdfd126ebc"
